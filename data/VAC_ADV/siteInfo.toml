# Site configuration for VAC_ADV (two-level advection tower, 2023 IOP).
# Heights and position from eddypro/metadata/vac_adv_2023_iop.metadata;
# the metadata lists both sonics as CSAT3 but the upper level is an
# IRGASON (user ruling 2026-08-24). Scalar keys must precede the
# [[sonics]] tables (TOML scoping).

# tower: orientation of the tower relative to the sonic head [deg]; the
# wind-direction QC flags the sector centred on (tower + sonic orientation).
# [ASSUMED] 180 = tower directly behind the boom-mounted head (same
# assumption as VAC001), i.e. shadow sector centred on 221 + 180 = 41 deg.
tower = 180
siteElevation = 18.2   # [m] [ASSUMED] copied from VAC001 ~1.3 km away on the same flat valley floor; metadata altitude is unfilled (0.0)
latitude = 38.289278   # [deg N] from eddypro/metadata/vac_adv_2023_iop.metadata; ITC stable-side Coriolis term
longitude = -121.924056  # [deg E] same source; written to the netCDF products as provenance
angle = 0.0            # slope angle [deg]

tableNames = ["VAC_ADV_10Hz", "VAC_ADV_30min"]
tableScanFrequency = [10, 0.000555555555556]   # [Hz]; 1/(30*60) for the 30-min logger table
tableNumberOfColumns = [26, 8]                 # 4 time cols + variables written by raw_processing

useTrefHMP = true
avgSlowFreq = 30
shiftzRef = false
zRefLowestSon = 3.07
ascending = false

# SSITC quality flag settings
SSITC_subAvgMin = 5        # sub-period length [min] for steady-state test
displacementHeight = 0     # [m]
canopyHeight = 0.3         # [m] from the EddyPro metadata
useCanopyITC = true

# Tower profile: one entry per sonic (height-keyed). hmp_height is the
# physical T/RH probe height paired with this sonic — the probes' true
# heights are undocumented (dewpoints suggest replicates), so [ASSUMED]
# equal to the sonic heights; see VAC_ADV_slow_process.py.
# orientation 221 is the corrected EddyPro north offset (metadata edit
# 2026-05-04); the errored 2025-11 EddyPro runs used 41 (180 deg flip)
# and the logger's sonic_azimuth column read 315 during the IOP.
[[sonics]]
height = 7.44          # IRGASON
orientation = 221
manufacturer = 1       # CSAT/IRGASON
hmp_height = 7.44

[[sonics]]
height = 3.07          # CSAT3 + LI-7500
orientation = 221
manufacturer = 1       # CSAT/IRGASON
hmp_height = 3.07
