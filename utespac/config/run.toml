# UTESpac run-level settings -- mirrors utespac.run_config.RunConfig
#
# The dataclass is the schema and holds these same defaults; values here
# override it when present, a config/run.toml in the working directory
# overrides this packaged file, and RunConfig.from_config(**kw) overrides
# both for one call. Keys omitted fall back to the dataclass. rootFolder
# (machine-specific) is deliberately absent: pass it to from_config or
# RunConfig(...).
#
# Site facts (sonics, heights, bearings, slope geometry, elevation,
# latitude, table names and scan rates) live in <site>/siteInfo.toml, not
# here.

[run]
UTESpacVersion = "5.0-Python"
avgPer = 30            # [min] averaging period; must divide 60

[output]
# The averaged products are always written as one utespac-run-2 netCDF per
# date (<Site>_<avgPer>minAvg_<PF>_<Det>_<date>.nc, utespac.run_io).
saveRawConditionedData = true   # high-frequency products (rotated winds, Ts, scalars)
#                                 as the utespac-hf-1 netCDF <Site>_hf_<PF>_<Det>_<date>.nc
#                                 (utespac.export_hf, integration notes A.2)
saveCSV = true                  # the averaged matrices as CSV under output/csv/

# Sensor-name templates: '*' stands for the height in the header name.
[template]
u = "Ux_*"
v = "Uy_*"
w = "Uz_*"
Tson = "T_Sonic_*"
sonDiagnostic = "diagnostic_*"
fw = "FW_*"
RH = "RH_*"
T = "Temp_*"
P = "Pressure_*"
irgaH2O = "H2O_*"
irgaH2OsigStrength = "H2Osig_*"
irgaCO2 = "CO2_*"
irgaCO2sigStrength = "CO2sig_*"
irgaGasDiag = "gas_diag_*"
LiH2O = "LiH2O_*"
LiCO2 = "LiCO2_*"
LiGasDiag = "Li_gas_diag_*"
KH2O = "KH2O_H2O_*"
cup = "cup_*"
birdSpd = "wbSpd_*"
birdDir = "wbDir_*"
# Floating-platform IMU (stages.motion): accel [m/s2 or g], angular rate
# [deg/s or rad/s], fused attitude [deg or rad] -- units and axis signs
# declared in the site's [imu] block (siteInfo.toml).
imuAx = "IMU_Ax*"
imuAy = "IMU_Ay*"
imuAz = "IMU_Az*"
imuGx = "IMU_Gx*"
imuGy = "IMU_Gy*"
imuGz = "IMU_Gz*"
imuRoll = "IMU_Roll*"
imuPitch = "IMU_Pitch*"
imuYaw = "IMU_Yaw*"
