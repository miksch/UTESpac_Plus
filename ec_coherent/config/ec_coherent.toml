# ec_coherent settings -- mirrors ec_coherent.config.ECConfig
#
# The dataclass is the schema and holds these same defaults; values here
# override it, a config/ec_coherent.toml in the working directory overrides
# this packaged file, and ECConfig.from_config(**kw) overrides both. Science
# behind each value: library/writeups/ec_preprocess.md, ec_spectra.md.
# Provenance labels follow LLM_PRACTICE (dopli): [CITED] [DERIVED] [ASSUMED].

[run]
modules = ["spectra", "ramps", "ampmod", "scales"]  # analyses to run, in order
output_suffix = "coherent"     # <Site>_coherent_<PF>_<Det>_<date>.nc next to the HF file

[preprocess]
detrend = "block"              # block | linear | recursive | butterworth -- Moncrieff et al. 2004 ch. 2;
#                                block is the Reynolds-averaging choice (eq. 2.8-2.11), [ASSUMED] as default
filter_tau_s = 300.0           # [s] RC time constant tau_f of 'recursive' (eq. 2.23) and 'butterworth'  [ASSUMED]
nan_max_frac = 0.1             # windows above this NaN fraction are rejected  [ASSUMED]
taylor_max_ratio = 0.5         # sigma_M / U_mean validity limit  [CITED] Stull 1988 eq. 1.4d

[spectra]
taper = "boxcar"               # boxcar | hann; boxcar closes Parseval exactly (task doc 2026-08-23)  [ASSUMED]
nperseg = 0                    # 0 = full-record periodogram; N = Welch segments of N samples
n_bins_per_decade = 10         # log-binning density  [ASSUMED]
scalars = ["Ts", "rhov", "rhoCO2"]

[ramps]
# Ramp detectors, library/writeups/ec_ramps.md
signals = ["Ts", "u", "e"]     # wavelet detector on Ts, u; "e" runs the TKE trigger (Mangan et al. 2022)
wavelet = "mhat"               # MHAT zero-crossing method  [CITED] Collineau & Brunet 1993 I §4.3.3
peak = "smallest_scale"        # smallest-scale variance maximum (Thomas & Foken 2007 §3.1) | "global" (CB 1993)
D_min_s = 6.2                  # [s] peak search over event durations D >= this  [CITED] Thomas & Foken 2007 §3.1 (low-pass <6.2 s; their spruce site)
a_min_s = 1.0                  # [s] scale grid  [ASSUMED]
a_max_s = 300.0
n_scales_per_decade = 16
slope_Ts = "auto"              # negative (unstable ramp) | positive (stable inverse ramp) | both | auto from sign(w'Ts')
slope_u = "positive"           # [CITED] CB 1993 I p. 375
edge_scales = 3.0              # detections within edge_scales * a0 of the window ends dropped  [ASSUMED]
refine = "none"                # none | ramp | haar -- re-time each event at the RAMP/HAAR transform extremum within +-a0
#                                (the MHAT zero-crossing lands ~0.35 a0 after an ideal microfront; DECIDE slot in the task doc)
max_events = 300

# Structure-function (surface renewal) detector -- Van Atta 1977 cubic, Spano et al. 1997
# lags/flux, Paw U et al. 2005 two-lag d/s split
sr_signals = ["Ts", "u"]       # series the cubic runs on; the kinematic SR flux is emitted for Ts only
sr_lags_s = [0.25, 0.5, 0.75, 1.0]  # [s] time lags r  [CITED] Spano 1997 p. 261 (8 Hz crops; transferability [ASSUMED])
sr_min_period_lags = 10.0      # lags with l+s < this * r are NaN  [CITED] Spano 1997 p. 261
sr_alpha = 1.0                 # weighting factor alpha; 1 well above the canopy  [CITED] Spano 1997 eq. 2
sr_alpha_mode = "fixed"        # fixed (use sr_alpha; ruled default, user 2026-08-23) | castellvi (similarity alpha
#                                per record from ustar/L, Castellvi & Snyder 2009 eq. 3) | fit ([SITE-TUNED]
#                                least-squares alpha against the measured w'Ts', per lag and file)
sr_d = 0.0                     # [m] zero-plane displacement for castellvi mode  [ASSUMED]

# TKE trigger -- Mangan et al. 2022 (u_TKE = sqrt(u'^2+v'^2+w'^2), MHAT at one scale)
tke_lp_s = 10.0                # [s] centred moving-mean window on u_TKE  [CITED] Mangan 2022 eq. 5 (their sites)
tke_a_s = 10.0                 # [s] fixed MHAT scale (~40 s period)  [CITED] Mangan 2022 p. 52 (their sites)
tke_thresh = 1.25              # trigger when a wave's min-to-max amplitude > thresh * record mean  [CITED] Mangan 2022 p. 54

[ampmod]
# Amplitude modulation, library/writeups/ec_ampmod.md (Mathis et al. 2009 decoupling,
# single-point form; Salesky & Anderson 2018 generalisation R_{b_l, a_s})
modulators = ["u", "w"]        # large-scale signals b_l; w_l is the "buoyancy proof" modulator  [CITED] SA18 p. 158
signals = ["u", "w", "Ts"]     # small-scale signals a_s
fluxes = ["uw", "wTs"]         # instantaneous-flux series u'w', w'Ts' decomposed like signals  [CITED] SA18 §1.3
cutoff_mode = "spectral_gap"   # spectral_gap | delta | scaled -- large/small cutoff (locked decision 3;
#                                sources use lambda = delta or z_i, absent here: deviation register, ec_ampmod.md)
delta_m = 1000.0               # [m] assumed outer scale, 'delta' mode and the gap fallback  [ASSUMED] (Salesky &
#                                Anderson 2020 assumed delta = 1000 m on AHATS; "not significantly sensitive")
z_mult = 100.0                 # 'scaled' mode: lambda_c = z_mult * z  [ASSUMED]

[scales]
# LSM/VLSM separation, library/writeups/ec_scales.md (bands small | lsm | vlsm)
signals = ["u", "w", "Ts"]     # per-band variance fractions
fluxes = ["uw", "wTs"]         # per-band covariance fractions
cutoff_mode = "spectral_gap"   # spectral_gap | delta | scaled (shared deviation entry, ec_ampmod.md)
delta_m = 1000.0               # [m] 'delta' mode: cuts at 0.1*pi*delta and pi*delta -- the ratios are
#                                [CITED] Balakumar & Adrian 2007 pp. 666, 671 (k_x delta = 20, 2); delta [ASSUMED]
z_mult_small = 10.0            # 'scaled' mode: small|LSM cut at z_mult_small * z  [ASSUMED]
z_mult_vlsm = 100.0            # 'scaled' mode: LSM|VLSM cut at z_mult_vlsm * z  [ASSUMED]
